<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Periodic Table (Rounded Masses)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Interactive Periodic Table</h1>
    <div class="controls">
      <input id="search" placeholder="Search by name, symbol, or atomic number..." />
      <select id="filterCategory">
        <option value="">All categories</option>
      </select>
      <button id="reset">Reset</button>
    </div>
  </header>

  <main>
    <section id="table" class="periodic-grid" aria-label="Periodic table"></section>
    <aside id="legend" class="legend"></aside>
  </main>

  <!-- Element detail modal -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true">
      <button id="closeModal" class="close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer>
    <small>Element masses rounded to the nearest whole number. Data embedded in elements.js.</small>
  </footer>

  <script src="elements.js"></script>
  <script src="script.js"></script>
</body>
</html>
